# Ultralytics 🚀 AGPL-3.0 License

# RT-DETR with EfficientNet-Lite + CBAM
# 轻量高效 + 通道空间注意力

nc: 80
scales:
  s: [0.33, 0.50, 512]

backbone:
  # EfficientNet-Lite inspired backbone
  - [-1, 1, Conv, [32, 3, 2]]  # 0-P1/2
  - [-1, 1, DWConv, [32, 3, 1, 1, False]]
  
  - [-1, 2, MBConv, [24, 3, 1, 1]]  # 2-P2/4
  - [-1, 3, MBConv, [40, 3, 2, 4]]  # 3-P3/8
  - [-1, 1, CBAM, [40]]
  
  - [-1, 3, MBConv, [80, 5, 2, 4]]  # 5-P4/16
  - [-1, 1, CBAM, [80]]
  
  - [-1, 4, MBConv, [192, 5, 2, 6]]  # 7-P5/32
  - [-1, 1, CBAM, [192]]
  
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, AIFI, [512, 4]]
  - [-1, 1, Conv, [256, 1, 1]]
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, C2f, [256, True]]
  - [-1, 1, Conv, [256, 1, 1]]
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [4, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 2, C2f, [256, True]]
  
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 2, C2f, [256, True]]
  
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C2f, [256, True]]
  
  - [[23, 26, 29], 1, RTDETRDecoder, [nc]]
