# RepGhostNet backbone for RT-DETR (更轻量版本)
nc: 12  # HomeObjects-3K number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # RT-DETR-RepGhostNet-nano
  s: [0.33, 0.50, 1024]  # RT-DETR-RepGhostNet-small
  m: [0.67, 0.75, 768]   # RT-DETR-RepGhostNet-medium
  l: [1.00, 1.00, 512]   # RT-DETR-RepGhostNet-large

backbone:
  # RepGhostNet backbone (轻量化版本)
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2
  - [-1, 1, RepGhostBottleneck, [16, 16, 3, 1]]   # 1
  - [-1, 1, RepGhostBottleneck, [16, 24, 3, 2]]   # 2-P2/4
  - [-1, 1, RepGhostBottleneck, [24, 24, 3, 1]]   # 3
  - [-1, 1, RepGhostBottleneck, [24, 40, 5, 2]]   # 4-P3/8
  - [-1, 1, RepGhostBottleneck, [40, 40, 5, 1]]   # 5
  - [-1, 1, RepGhostBottleneck, [40, 80, 3, 2]]   # 6-P4/16
  - [-1, 1, RepGhostBottleneck, [80, 80, 3, 1]]   # 7
  - [-1, 1, RepGhostBottleneck, [80, 80, 3, 1]]   # 8
  - [-1, 1, RepGhostBottleneck, [80, 112, 3, 1]]  # 9
  - [-1, 1, RepGhostBottleneck, [112, 112, 3, 1]] # 10
  - [-1, 1, RepGhostBottleneck, [112, 160, 5, 2]] # 11-P5/32
  - [-1, 1, RepGhostBottleneck, [160, 160, 5, 1]] # 12

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input projection
  - [-1, 1, AIFI, [256, 8]] # 14
  - [-1, 1, Conv, [256, 1, 1]]   # 15, Y5, Transformer connection

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[-1, 10], 1, Concat, [1]]  # 17, cat P4
  - [-1, 1, RepC3, [256, 0.5]]   # 18

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 19
  - [[-1, 5], 1, Concat, [1]]   # 20, cat P3
  - [-1, 1, RepC3, [256, 0.5]]   # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]   # 22
  - [[-1, 18], 1, Concat, [1]]   # 23, cat P4
  - [-1, 1, RepC3, [256, 0.5]]   # 24 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]   # 25
  - [[-1, 15], 1, Concat, [1]]   # 26, cat P5
  - [-1, 1, RepC3, [256, 0.5]]   # 27 (P5/32-large)

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)